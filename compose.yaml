services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OWNERGATE_ADMIN_TOKEN: ${OWNERGATE_ADMIN_TOKEN:?Set a random administrator token}
      OWNERGATE_AUDIENCE: http://127.0.0.1:8000
    volumes:
      - gateway-state:/state
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  gateway-state:
