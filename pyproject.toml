[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ownergate"
version = "0.1.0"
description = "Verifiable machine identity and HTTP resource access gateway"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "cryptography>=44", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.50,<2", "pip-audit>=2.9,<3"]

[project.scripts]
ownergate = "ownergate.cli:main"

[tool.setuptools.package-data]
ownergate = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ownergate*"]
namespaces = false
