name: Verify single-host pilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p test-evidence && python -m pytest -q --junitxml=test-evidence/junit.xml
        env:
          CHROMIUM_EXECUTABLE: /nonexistent/use-playwright-managed-chromium
          OWNERGATE_SCREENSHOTS: test-evidence
      - run: pip-audit -r requirements.lock --disable-pip --no-deps
      - run: |
          export OWNERGATE_ADMIN_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          trap 'docker compose down -v' EXIT
          docker compose build
          docker compose up -d --wait
          python scripts/pilot_demo.py --output test-evidence/compose-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: test-evidence/
